<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOI 檢測看板 / AOI Inspection Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F6F8}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div lang="{{t.langCode}}" style="font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1F2937; background: #F5F6F8; min-height: 100vh; padding: 24px 16px 48px; box-sizing: border-box">
<div style="max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid #D1D5DB">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.02em">{{t.title}}</h1>
<p style="margin: 0; font-size: 13px; color: #4B5563">{{t.source}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<p style="margin: 0; font-size: 12px; color: #4B5563; font-family: 'Roboto Mono', monospace">{{t.updated}} 2026-11-04 07:30</p>
<div role="group" aria-label="語言 / Language" style="display: flex; border: 1px solid #D1D5DB; border-radius: 4px; overflow: hidden">
<template data-sc="for" list="{{langs}}" as="l" hint-placeholder-count="2">
<button type="button" aria-pressed="{{l.on}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
</template>
</div>
</div>
</header>

<section aria-label="{{t.filters}}" style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 6px; padding: 12px 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-size: 13px; color: #4B5563; margin-right: 4px">{{t.line}}</span>
<template data-sc="for" list="{{lines}}" as="p" hint-placeholder-count="5">
<button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-size: 13px; color: #4B5563; margin-right: 4px">{{t.shift}}</span>
<template data-sc="for" list="{{shifts}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
</template>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-size: 13px; color: #4B5563; margin-right: 4px">{{t.model}}</span>
<template data-sc="for" list="{{models}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
</template>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<label for="f-date" style="font-size: 13px; color: #4B5563">{{t.date}}</label>
<button id="f-date" type="button" style="min-height: 36px; padding: 0 12px; border: 1px solid #D1D5DB; border-radius: 4px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2937; font-family: 'Roboto Mono', monospace">2026-10-29 ~ 2026-11-04</button>
</div>
<span style="font-size: 12px; color: #4B5563; margin-left: auto">{{scope}}</span>
</section>

<section aria-label="KPI" style="display: flex; flex-wrap: wrap; gap: 12px">
<template data-sc="for" list="{{kpis}}" as="k" hint-placeholder-count="5">
<div style="flex: 1 1 200px; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #4B5563">{{k.label}}</span>
<span style="{{k.style}}">{{k.value}}</span>
<span style="font-size: 12px; color: #4B5563">{{k.sub}}</span>
</div>
</template>
</section>

<section aria-label="{{t.chTitle}}" style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: stretch; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">{{t.chTitle}}</h2>
<span style="font-size: 12px; color: #4B5563">{{ch.sub}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
<div role="group" aria-label="{{t.lineSel}}" style="display: flex; align-items: center; gap: 6px; padding-right: 12px; border-right: 1px solid #E5E7EB">
<span style="font-size: 12px; color: #4B5563">{{t.lineSel}}</span>
<div style="display: flex; flex-wrap: wrap; border: 1px solid #D1D5DB; border-radius: 4px; overflow: hidden">
<template data-sc="for" list="{{ch.lineBtns}}" as="lb" hint-placeholder-count="5">
<button type="button" aria-pressed="{{lb.on}}" onClick="{{lb.pick}}" style="{{lb.style}}">{{lb.label}}</button>
</template>
</div>
</div>
<div role="group" aria-label="{{t.xAxis}}" style="display: flex; align-items: center; gap: 6px">
<span style="font-size: 12px; color: #4B5563">{{t.xAxis}}</span>
<div style="display: flex; border: 1px solid #D1D5DB; border-radius: 4px; overflow: hidden">
<template data-sc="for" list="{{ch.views}}" as="v" hint-placeholder-count="2">
<button type="button" aria-pressed="{{v.on}}" onClick="{{v.pick}}" style="{{v.style}}">{{v.label}}</button>
</template>
</div>
</div>
<label style="display: flex; align-items: center; gap: 6px; min-height: 36px; font-size: 13px; font-weight: 500; cursor: pointer; padding-right: 12px; border-right: 1px solid #E5E7EB">
<input type="checkbox" checked="{{ch.stack}}" onChange="{{ch.toggleStack}}" style="width: 16px; height: 16px; margin: 0; accent-color: #1F2937">{{t.stack}}
</label>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{t.cmpPick}}</legend>
<template data-sc="for" list="{{ch.checks}}" as="c" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 6px; min-height: 36px; font-size: 13px; cursor: pointer">
<input type="checkbox" checked="{{c.checked}}" onChange="{{c.toggle}}" style="width: 16px; height: 16px; margin: 0; accent-color: #1F2937">
<span style="{{c.swatch}}"></span>{{c.label}}
</label>
</template>
</fieldset>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 16px; font-size: 12px; color: #374151; min-height: 16px">
<template data-sc="if" value="{{ch.lineLegendOn}}" hint-placeholder-val="{{false}}">
<template data-sc="for" list="{{ch.lineLegend}}" as="ll" hint-placeholder-count="4">
<span style="display: flex; align-items: center; gap: 6px"><span style="{{ll.swatch}}"></span>{{ll.label}}</span>
</template>
</template>
<template data-sc="if" value="{{ch.shiftLegend}}" hint-placeholder-val="{{false}}">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #93C5FD; display: inline-block"></span>{{t.dayLegend}}</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #1E3A8A; display: inline-block"></span>{{t.nightLegend}}</span>
</template>
<template data-sc="if" value="{{ch.stackNote}}" hint-placeholder-val="{{true}}">
<span>{{t.stackNote}}</span>
</template>
</div>
<template data-sc="if" value="{{ch.empty}}" hint-placeholder-val="{{false}}">
<div style="height: 260px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #4B5563; border: 1px dashed #D1D5DB; border-radius: 4px">{{ch.emptyText}}</div>
</template>
<template data-sc="if" value="{{ch.has}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 8px">
<div style="display: flex; flex-direction: column; justify-content: space-between; height: 200px; margin-top: 22px; font-size: 11px; color: #4B5563; font-family: 'Roboto Mono', monospace; text-align: right; width: 32px">
<span>{{ch.axisTop}}</span><span>{{ch.axisMid}}</span><span>0</span>
</div>
<div style="flex: 1; min-width: 0; overflow-x: auto">
<div style="{{ch.innerStyle}}">
<template data-sc="for" list="{{ch.groups}}" as="g" hint-placeholder-count="7">
<div style="{{g.groupStyle}}">
<div style="height: 222px; width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 8px; border-bottom: 1px solid #D1D5DB">
<template data-sc="for" list="{{g.subs}}" as="sb" hint-placeholder-count="1">
<div style="display: flex; align-items: flex-end; gap: 3px">
<template data-sc="for" list="{{sb.bars}}" as="bar" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<template data-sc="if" value="{{bar.showTotal}}" hint-placeholder-val="{{true}}">
<span style="font-size: 11px; font-family: 'Roboto Mono', monospace; font-weight: 500">{{bar.total}}</span>
</template>
<div title="{{bar.tip}}" style="{{bar.stackStyle}}">
<template data-sc="for" list="{{bar.segs}}" as="sg" hint-placeholder-count="4">
<div title="{{sg.tip}}" style="{{sg.style}}"></div>
</template>
</div>
</div>
</template>
</div>
</template>
</div>
<div style="display: flex; justify-content: center; gap: 8px; font-size: 11px; color: #4B5563">
<template data-sc="for" list="{{g.subs}}" as="sb" hint-placeholder-count="1">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="display: flex; gap: 3px">
<template data-sc="for" list="{{sb.bars}}" as="bar" hint-placeholder-count="2">
<span style="{{bar.labelStyle}}">{{bar.label}}</span>
</template>
</div>
<template data-sc="if" value="{{sb.hasLabel}}" hint-placeholder-val="{{false}}">
<span style="{{sb.labelStyle}}">{{sb.label}}</span>
</template>
</div>
</template>
</div>
<span style="{{g.labelStyle}}">{{g.label}}</span>
</div>
</template>
</div>
</div>
</div>
<p style="margin: 0; font-size: 12px; color: #4B5563">{{ch.note}}</p>
</template>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px">
<section aria-label="{{t.dTitle}}" style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">{{t.dTitle}}</h2>
<span style="font-size: 12px; color: #4B5563">{{t.dNote}}</span>
</div>
<template data-sc="for" list="{{defects}}" as="d" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px; font-size: 13px">
<span style="font-weight: 500">{{d.name}} <span style="color: #4B5563; font-weight: 400">{{d.local}}</span></span>
<span style="font-family: 'Roboto Mono', monospace">{{d.text}}</span>
</div>
<div style="height: 12px; background: #F3F4F6; border-radius: 2px; overflow: hidden">
<div style="{{d.bar}}"></div>
</div>
</div>
</template>
</section>

<section aria-label="{{t.fxTitle}}" style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">{{t.fxTitle}}</h2>
<template data-sc="for" list="{{fixtures}}" as="f" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px">
<span style="width: 72px; font-family: 'Roboto Mono', monospace; font-weight: 500">{{f.ver}}</span>
<div style="flex: 1; height: 12px; background: #F3F4F6; border-radius: 2px; overflow: hidden"><div style="{{f.bar}}"></div></div>
<span style="width: 160px; text-align: right; font-family: 'Roboto Mono', monospace; color: #374151">{{f.text}}</span>
</div>
</template>
<p style="margin: 0; font-size: 12px; color: #4B5563">{{t.fxNote}}</p>
</section>

<section aria-label="{{t.rvTitle}}" style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">{{t.rvTitle}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<template data-sc="for" list="{{rvBoxes}}" as="x" hint-placeholder-count="3">
<div style="flex: 1 1 120px; border: 1px solid #E5E7EB; border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: #4B5563">{{x.label}}</span>
<span style="{{x.style}}">{{x.value}}</span>
</div>
</template>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 13px">
<span style="color: #374151">{{t.fcSrc}}</span>
<template data-sc="for" list="{{fcTop}}" as="c" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #F3F4F6; padding-bottom: 6px">
<span>{{c.name}}</span><span style="font-family: 'Roboto Mono', monospace; white-space: nowrap">{{c.val}}</span>
</div>
</template>
</div>
</section>
</div>

<section aria-label="{{t.ltTitle}}" style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">{{t.ltTitle}}</h2>
<span style="font-size: 12px; color: #4B5563">{{tableScope}}</span>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 960px; border-collapse: collapse; font-size: 13px">
<thead>
<tr style="background: #F9FAFB; color: #374151; text-align: right">
<template data-sc="for" list="{{lineHeads}}" as="h" hint-placeholder-count="10">
<th style="{{h.style}}">{{h.label}}</th>
</template>
</tr>
</thead>
<tbody>
<template data-sc="for" list="{{lineRows}}" as="r" hint-placeholder-count="4">
<tr style="{{r.rowStyle}}">
<td style="text-align: left; padding: 10px 12px; border-bottom: 1px solid #F3F4F6; font-family: 'Noto Sans TC', sans-serif; font-weight: 500">{{r.line}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid #F3F4F6">{{r.boards}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid #F3F4F6">{{r.bridge}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid #F3F4F6">{{r.nopin}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid #F3F4F6">{{r.pinhigh}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid #F3F4F6">{{r.missing}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid #F3F4F6; font-weight: 500">{{r.dpu}}</td>
<td style="{{r.rateStyle}}">{{r.rate}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid #F3F4F6">{{r.fc}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid #F3F4F6">{{r.review}}</td>
</tr>
</template>
</tbody>
</table>
</div>
</section>

<section aria-label="{{t.bdTitle}}" style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">{{t.bdTitle}}</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<span style="font-size: 12px; color: #4B5563">{{bdNote}}</span>
<div role="group" aria-label="{{t.imgLoad}}" style="display: flex; align-items: center; gap: 6px">
<span style="font-size: 12px; color: #4B5563">{{t.imgLoad}}</span>
<div style="display: flex; border: 1px solid #D1D5DB; border-radius: 4px; overflow: hidden">
<template data-sc="for" list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
</template>
</div>
</div>
</div>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 1180px; border-collapse: collapse; font-size: 13px">
<thead>
<tr style="background: #F9FAFB; color: #374151; text-align: left">
<template data-sc="for" list="{{bdHeads}}" as="h" hint-placeholder-count="12">
<th style="padding: 10px 12px; border-bottom: 1px solid #E5E7EB; font-weight: 500; white-space: nowrap">{{h}}</th>
</template>
</tr>
</thead>
<tbody>
<template data-sc="for" list="{{boards}}" as="b" hint-placeholder-count="10">
<tr>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6; font-family: 'Roboto Mono', monospace">{{b.sn}}</td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6; font-family: 'Roboto Mono', monospace">{{b.time}}</td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6">{{b.line}}</td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6">{{b.shift}}</td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6; font-family: 'Roboto Mono', monospace">{{b.model}}</td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6">{{b.type}}</td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6; font-family: 'Roboto Mono', monospace">{{b.fixture}}</td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6">{{b.defect}}</td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6"><span style="{{b.reviewStyle}}">{{b.review}}</span></td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6"><span style="{{b.resultStyle}}">{{b.result}}</span></td>
<td style="padding: 9px 12px; border-bottom: 1px solid #F3F4F6">{{b.op}}</td>
<td style="padding: 6px 12px; border-bottom: 1px solid #F3F4F6">
<template data-sc="if" value="{{b.auto}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{b.getImg}}" aria-label="{{b.imgAria}}" style="{{b.thumbStyle}}"><span style="position: absolute; left: 50%; top: 28%; width: 14px; height: 10px; border: 1.5px solid #B91C1C"></span></button>
</template>
<template data-sc="if" value="{{b.manual}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{b.getImg}}" aria-label="{{b.imgAria}}" style="{{b.imgBtnStyle}}">{{b.imgLabel}}</button>
</template>
</td>
</tr>
</template>
</tbody>
</table>
</div>
<template data-sc="if" value="{{hasImg}}" hint-placeholder-val="{{false}}">
<div style="border: 1px solid #E5E7EB; border-radius: 6px; padding: 16px; display: flex; flex-wrap: wrap; gap: 16px; background: #FAFAFA">
<template data-sc="if" value="{{imgLoading}}" hint-placeholder-val="{{false}}">
<div style="flex: 1 1 100%; min-height: 220px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #4B5563">{{img.loadingText}}</div>
</template>
<template data-sc="if" value="{{imgReady}}" hint-placeholder-val="{{false}}">
<figure style="flex: 1 1 420px; margin: 0; display: flex; flex-direction: column; gap: 6px">
<div role="img" aria-label="{{img.alt}}" style="position: relative; height: 260px; border: 1px dashed #9CA3AF; border-radius: 4px; background: #E5E7EB; display: flex; align-items: center; justify-content: center">
<span style="font-size: 13px; color: #374151">{{img.placeholder}}</span>
<div style="position: absolute; left: 58%; top: 34%; width: 54px; height: 40px; border: 2px solid #B91C1C"></div>
</div>
<figcaption style="font-size: 12px; color: #4B5563">{{t.caption}}</figcaption>
</figure>
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px; font-size: 13px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">{{img.sn}}</h3>
<template data-sc="for" list="{{img.rows}}" as="ir" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #E5E7EB; padding-bottom: 6px"><span style="color: #4B5563">{{ir.k}}</span><span style="font-family: 'Roboto Mono', 'Noto Sans TC', monospace">{{ir.v}}</span></div>
</template>
<p style="margin: 0; font-size: 12px; color: #4B5563">{{imgNote}}</p>
<button type="button" onClick="{{closeImg}}" style="align-self: flex-start; min-height: 36px; padding: 0 14px; border: 1px solid #D1D5DB; border-radius: 4px; background: #FFFFFF; font: inherit; font-size: 13px; cursor: pointer">{{t.close}}</button>
</div>
</template>
</div>
</template>
</section>

</div>
</div>
</template>
<script>
(function () {
  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    var v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  var WHOLE = /^\{\{([^}]+)\}\}$/;
  function interp(str, scope) {
    return str.replace(/\{\{([^}]+)\}\}/g, function (_, p) { var v = lookup(p, scope); return v == null ? '' : String(v); });
  }
  function value(str, scope) { var m = str.match(WHOLE); return m ? lookup(m[1], scope) : interp(str, scope); }
  function render(nodes, scope, out) {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];

function rnd(seed) { var x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); }

var DATA = {};

    MODELS.forEach(function (m, mi) {

      var d = base.d.map(function (v, k) { return v * MFACT[m][k] * (0.88 + 0.24 * rnd(seed * 7 + k)); });

    var dayF = { D: [1.03, 0.96, 1.12, 0.93, 0.90, 0.97, 0.88], N: [1.01, 0.95, 1.13, 0.90, 0.93, 0.87, 0.82] };
    function sum(v) { return v[0] + v[1] + v[2] + v[3]; }
    var LCOLORS = { CD101: '#1E3A8A', CD102: '#0F766E', CD103: '#C2410C', CD104: '#7C3AED' };
    var raw;
    if (isLine) {
      raw = chSel.map(function (l) {
        return { key: l, sel: st.line === l, subs: [{ line: l, bars: selShifts.map(function (sh) {
          var a = agg([l], [sh], selModels);
          return { sh: sh, vals: a.pts.map(function (c) { return c / a.b; }) };
        }) }] };
      });
    } else {
      var baseT = {};
      chSel.forEach(function (l) {
        baseT[l] = {};
        SHIFTS.forEach(function (sh) { var a = agg([l], [sh], selModels); baseT[l][sh] = a.pts.map(function (c) { return c / a.b; }); });
      });
      raw = dates.map(function (dt, i) {
        return { key: dt, sel: false, subs: chSel.map(function (l) {
          var li = LINES.indexOf(l);
          return { line: l, bars: selShifts.map(function (sh) {
            var si = sh === 'D' ? 0 : 1;
            var v = baseT[l][sh].map(function (x, k) { return x * dayF[sh][i] * (0.88 + 0.24 * rnd(chSeed + li * 131 + i * 7 + k * 3 + si * 50)); });
            var tot = sum(v), r2 = rnd(chSeed + li * 17 + i * 5 + si * 29);
            var tgt = tot > 5.8 ? 5.45 + 0.4 * r2 : (tot < 3.15 ? 3.12 + 0.35 * r2 : tot);
            return { sh: sh, vals: v.map(function (x) { return x * tgt / tot; }) };
          }) };
        }) };
      });
    }
    var maxTot = 0, hi = null, lo = null, nightHigher = 0;
    raw.forEach(function (g) {
      g.subs.forEach(function (sb) {
        sb.bars.forEach(function (b) {
          b.vals = b.vals.map(function (v, i) { return types[i] ? v : 0; });
          b.total = sum(b.vals);
          if (b.total > maxTot) maxTot = b.total;
          var name = (isLine ? g.key : g.key + ' ' + sb.line) + ' ' + shiftName[b.sh];
          if (!hi || b.total > hi.v) hi = { n: name, v: b.total };
          if (!lo || b.total < lo.v) lo = { n: name, v: b.total };
        });
        if (sb.bars.length === 2 && sb.bars[1].total > sb.bars[0].total) nightHigher++;
      });
    });
    var step = maxTot > 3 ? 1 : (maxTot > 1 ? 0.5 : 0.2);
    var axisMax = Math.max(step, Math.ceil(maxTot * 1.08 / step) * step);
    var multi = !isLine && chSel.length > 1;
    var nb = (isLine ? 1 : chSel.length) * selShifts.length;
    var bw = isLine ? 40 : (nb <= 2 ? (two ? 24 : 36) : (nb <= 4 ? 18 : 12));
    var wide = bw >= 18;
    var subW = selShifts.length * bw + (selShifts.length - 1) * 3;
    var groupMin = (isLine ? 110 : Math.max(72, (isLine ? 1 : chSel.length) * subW + ((isLine ? 1 : chSel.length) - 1) * 8 + 12));
    var lineColorMode = !stack && multi;
    var groups = raw.map(function (g) {
      return {
        label: g.key,
        groupStyle: 'flex: 1; min-width: ' + groupMin + 'px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 4px; ' + (g.sel ? 'background: #EFF6FF' : ''),
        labelStyle: 'font-size: ' + (isLine ? 13 : 12) + 'px; padding-bottom: 4px; ' + (isLine ? '' : "font-family: 'Roboto Mono', monospace; ") + (g.sel ? 'font-weight: 700; color: #1D4ED8' : 'font-weight: 500'),
        subs: g.subs.map(function (sb) {
          return {
            hasLabel: multi,
            label: wide ? sb.line : sb.line.slice(2),
            labelStyle: 'width: ' + subW + 'px; display: flex; justify-content: center; white-space: nowrap; font-family: \'Roboto Mono\', monospace; color: ' + (lineColorMode ? LCOLORS[sb.line] : '#374151') + '; font-weight: 500',
            bars: sb.bars.map(function (b) {
              var light = two && b.sh === 'D';
              var tip = (isLine ? g.key : g.key + ' ' + sb.line) + ' ' + shiftName[b.sh] + ' DPU ' + b.total.toFixed(2);
              var solid = lineColorMode ? LCOLORS[sb.line] : (b.sh === 'D' ? '#93C5FD' : '#1E3A8A');
              return {
                showTotal: wide,
                label: two ? (wide ? (b.sh === 'D' ? t.dayS : t.nightS) : '') : (multi ? '' : shiftName[b.sh]),
                labelStyle: 'width: ' + bw + 'px; display: flex; justify-content: center; white-space: nowrap',
                stackStyle: 'width: ' + bw + 'px; display: flex; flex-direction: column-reverse',
                total: b.total.toFixed(2), tip: tip,
                segs: stack ? b.vals.map(function (v, i) {
                  return { tip: DCODES[i] + ' ' + v.toFixed(2),
                    style: 'width: 100%; background: ' + DCOLORS[i] + '; height: ' + (v / axisMax * 200).toFixed(1) + 'px' + (light ? '; opacity: 0.55' : '') };
                }) : [{ tip: tip,
                    style: 'width: 100%; border-radius: 2px 2px 0 0; background: ' + solid + '; height: ' + (b.total / axisMax * 200).toFixed(1) + 'px' + (lineColorMode && light ? '; opacity: 0.5' : '') }]
              };
            })
          };
        })
      };
    });
    var typesText = allOn ? t.allDefects : DCODES.filter(function (c, i) { return types[i]; }).join(' + ');
    var note = '';
    if (hi) {
      note = (!isLine && two && chSel.length === 1) ? (nightHigher === 7 ? t.tAll : t.tSome(nightHigher)) + t.tTail
        : t.cmpNote(hi.n + ' ' + hi.v.toFixed(2), lo.n + ' ' + lo.v.toFixed(2), (hi.v - lo.v).toFixed(2));
    }
    var ch = {
      checks: checks, groups: groups, empty: nOn === 0 || !chSel.length, has: nOn > 0 && chSel.length > 0,
      emptyText: !chSel.length ? t.lineEmpty : t.cmpEmpty, lineBtns: lineBtns,
      stack: stack, toggleStack: function () { self.setState({ stack: !stack }); },
      shiftLegend: !stack && !lineColorMode, stackNote: (stack || lineColorMode) && two,
      lineLegendOn: lineColorMode,
      lineLegend: chSel.map(function (l) { return { label: l, swatch: 'width: 10px; height: 10px; display: inline-block; background: ' + LCOLORS[l] }; }),
      views: [[t.byDate, 'date'], [t.byLine, 'line']].map(function (v) {
        var on = st.view === v[1];
        return { label: v[0], on: on ? 'true' : 'false', style: self.seg(on), pick: function () { self.setState({ view: v[1] }); } };
      }),
      axisTop: axisMax.toFixed(1), axisMid: (axisMax / 2).toFixed(1),
      innerStyle: 'min-width: ' + (isLine ? 520 : Math.max(600, groupMin * 7)) + 'px; display: flex; justify-content: space-around; border-left: 1px solid #D1D5DB',
      sub: t.cmpSub(typesText, chLineLabel + t.sep + shiftLabel + t.sep + modelLabel),
      note: note
    };

    // 缺陷類型
    var maxPts = Math.max.apply(null, s.pts);
    var defects = s.pts.map(function (c, i) {
      return {
        name: DCODES[i], local: t.dNames[i],
        text: (c / s.b).toFixed(2) + ' ・ ' + fmt(c) + t.pts + ' ・ ' + Math.round(c / s.real * 100) + '%',
        bar: 'height: 100%; width: ' + (c / maxPts * 100).toFixed(1) + '%; background: ' + DCOLORS[i]
      };
    });

    // 線體表
    var cell = 'padding: 10px 12px; border-bottom: 1px solid #F3F4F6; ';
    var lineHeads = t.lineHeads.map(function (h, i) {
      return { label: h, style: 'padding: 10px 12px; border-bottom: 1px solid #E5E7EB; font-weight: 500; white-space: nowrap; text-align: ' + (i === 0 ? 'left' : 'right') };
    });
    var lineRows = LINES.map(function (l) {
      var a = agg([l], selShifts, selModels);
      var rate = a.real / (a.b * PINS) * 100;
      return {
        line: l, boards: fmt(a.b),
        bridge: (a.pts[0] / a.b).toFixed(2), nopin: (a.pts[1] / a.b).toFixed(2),
        pinhigh: (a.pts[2] / a.b).toFixed(2), missing: (a.pts[3] / a.b).toFixed(2),
        dpu: (a.real / a.b).toFixed(2), rate: rate.toFixed(2) + '%',
        fc: (a.fcPts / a.calls * 100).toFixed(1) + '%', review: (a.rv / a.ng * 100).toFixed(1) + '%',
        rateStyle: cell + (rate > 2.5 ? 'color: #B91C1C; font-weight: 700' : ''),
        rowStyle: "text-align: right; font-family: 'Roboto Mono', monospace; " + (st.line === l ? 'background: #EFF6FF' : '')
      };
    });

    // 載具版本
    var overall = s.real / s.b;
    var fxF = [1.24, 0.99, 0.83];
    var fxShare = [0.19, 0.48, 0.33];
    var fxVals = fxF.map(function (f, i) { return overall * f * (0.96 + 0.08 * rnd(seedBase + 60 + i + selShifts.length * 3)); });
    var fxMax = Math.max.apply(null, fxVals);
    var fixtures = ['SP-A02', 'SP-A03', 'SP-A04'].map(function (v, i) {
      return { ver: v, text: fxVals[i].toFixed(2) + ' ・ ' + fmt(s.b * fxShare[i]) + t.boardsUnit,
        bar: 'height: 100%; background: #475569; width: ' + (fxVals[i] / fxMax * 100).toFixed(1) + '%' };
    });

    // 複判
    var mid = "font-size: 20px; font-weight: 700; font-family: 'Roboto Mono', monospace; ";
    var rvBoxes = [
      { label: t.real, value: fmt(s.real) + t.pts, style: mid },
      { label: t.fcL, value: fmt(s.fcPts) + t.pts, style: mid + 'color: #B45309' },
      { label: t.unrev, value: fmt(s.ng - s.rv) + t.pcs, style: mid + 'color: #B91C1C' }
    ];
    var p0 = 0.40 + 0.1 * rnd(seedBase + 80 + selShifts.length), p1 = 0.27 + 0.08 * rnd(seedBase + 90 + selShifts.length);
    var f0 = Math.round(s.fcPts * p0), f1 = Math.round(s.fcPts * p1), f2 = s.fcPts - f0 - f1;
    var fcTop = [f0, f1, f2].map(function (v, i) {
      return { name: t.fcNames[i], val: fmt(v) + t.pts + ' ・ ' + Math.round(v / s.fcPts * 100) + '%' };
    });

    // 單板明細
    var auto = this.isAuto();
    var modes = [[t.modeAuto, true], [t.modeClick, false]].map(function (m) {
      var on = auto === m[1];
      return { label: m[0], on: on ? 'true' : 'false', style: self.seg(on), pick: function () { self.setState({ autoImg: m[1], imgLoading: false }); } };
    });
    var badge = 'display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; white-space: nowrap; ';
    var allBoards = [
      ['B2611040312', '11/04 06:52', 'CD103', 'N', 'A100', 'SP-A02', 'Bridge', 1, 'real', 'A. Somchai'],
      ['B2611040298', '11/04 06:31', 'CD101', 'N', 'A100', 'SP-A03', 'Pin High', 1, 'false', 'K. Nattapong'],
      ['B2611040277', '11/04 05:58', 'CD102', 'N', 'B210', 'SP-A03', 'No Pin', 0, '', ''],
      ['B2611040251', '11/04 05:12', 'CD103', 'N', 'B210', 'SP-A02', 'Missing', 1, 'real', 'A. Somchai'],
      ['B2611040233', '11/04 04:40', 'CD104', 'N', 'B210', 'SP-A04', 'No Pin', 1, 'real', 'P. Wanida'],
      ['B2611040190', '11/04 03:05', 'CD102', 'N', 'A100', 'SP-A03', 'Bridge', 1, 'false', 'K. Nattapong'],
      ['B2611040147', '11/04 01:38', 'CD104', 'N', 'A100', 'SP-A02', 'Pin High', 1, 'real', 'P. Wanida'],
      ['B2611030968', '11/03 18:44', 'CD101', 'D', 'A100', 'SP-A04', 'Bridge', 1, 'real', '林小芬'],
      ['B2611030921', '11/03 17:20', 'CD103', 'D', 'A100', 'SP-A03', 'Pin High', 1, 'real', '陳志明'],
      ['B2611030876', '11/03 15:47', 'CD104', 'D', 'B210', 'SP-A04', 'Missing', 1, 'false', '林小芬'],
      ['B2611030803', '11/03 13:09', 'CD102', 'D', 'B210', 'SP-A02', 'No Pin', 0, '', ''],
      ['B2611030755', '11/03 11:26', 'CD101', 'D', 'B210', 'SP-A03', 'No Pin', 1, 'real', '陳志明'],
      ['B2611030702', '11/03 09:15', 'CD103', 'D', 'A100', 'SP-A02', 'Bridge', 1, 'real', '林小芬'],
      ['B2611030664', '11/03 08:32', 'CD104', 'D', 'A100', 'SP-A03', 'Bridge', 1, 'false', '陳志明']
    ];
    function resultOf(code) { return code === 'real' ? t.isReal : (code === 'false' ? t.isFalse : '—'); }
    var boards = allBoards.filter(function (b) {
      return (st.line === 'ALL' || b[2] === st.line) && (st.shift === 'ALL' || b[3] === st.shift) && (st.model === 'ALL' || b[4] === st.model);
    }).map(function (b) {
      var done = b[7] === 1;
      return {
        sn: b[0], time: b[1], line: b[2], shift: shiftName[b[3]], model: MODEL_CODE[b[4]], type: typeName[MODEL_TYPE[b[4]]], fixture: b[5], defect: b[6],
        review: done ? t.reviewed : t.pending,
        reviewStyle: done ? badge + 'background: #F3F4F6; color: #374151' : badge + 'background: #B91C1C; color: #FFFFFF; font-weight: 500',
        result: resultOf(b[8]),
        resultStyle: b[8] === 'real' ? badge + 'background: #FEE2E2; color: #991B1B' : (b[8] === 'false' ? badge + 'background: #FEF3C7; color: #92400E' : 'color: #6B7280'),
        op: b[9] || '—',
        auto: auto, manual: !auto,
        thumbStyle: 'position: relative; width: 56px; height: 36px; padding: 0; border-radius: 3px; cursor: pointer; background: #D1D5DB; ' +
          (st.imgSn === b[0] ? 'border: 2px solid #1F2937' : 'border: 1px solid #9CA3AF'),
        getImg: function () { self.fetchImg(b[0]); },
        imgAria: t.imgAria(b[0]),
        imgLabel: st.fetched[b[0]] ? t.viewImg : t.getImg,
        imgBtnStyle: 'min-height: 32px; padding: 0 10px; border-radius: 4px; font: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; ' +
          (st.imgSn === b[0] ? 'background: #1F2937; color: #FFFFFF; border: 1px solid #1F2937'
            : (st.fetched[b[0]] ? 'background: #FFFFFF; color: #1D4ED8; border: 1px solid #93C5FD' : 'background: #FFFFFF; color: #1F2937; border: 1px solid #D1D5DB'))
      };
    });

    var cur = null;
    allBoards.forEach(function (b) { if (b[0] === st.imgSn) cur = b; });
    var img = cur ? {
      sn: cur[0], loadingText: t.loading(cur[0]), placeholder: t.placeholder(cur[6]), alt: t.alt(cur[0], cur[6]),
      rows: [
        { k: t.pDefect, v: cur[6] },
        { k: t.pLineShift, v: cur[2] + t.sep + shiftName[cur[3]] },
        { k: t.pModelFx, v: MODEL_CODE[cur[4]] + t.sep + cur[5] },
        { k: t.pLoc, v: t.locVal },
        { k: t.pResult, v: cur[8] ? resultOf(cur[8]) : t.pending }
      ]
    } : { sn: '', loadingText: '', placeholder: '', alt: '', rows: [] };

    return {
      t: t, langs: langs, lines: lines, shifts: shifts, models: models, scope: scope,
      kpis: kpis, ch: ch, defects: defects,
      tableScope: shiftLabel + t.sep + modelLabel,
      lineHeads: lineHeads, lineRows: lineRows, fixtures: fixtures, rvBoxes: rvBoxes, fcTop: fcTop,
      bdNote: t.bdNote(boards.length), bdHeads: t.bdHeads, modes: modes, boards: boards,
      imgNote: auto ? t.noteAuto : t.noteClick,
      hasImg: !!cur, imgLoading: !!cur && st.imgLoading, imgReady: !!cur && !st.imgLoading, img: img,
      closeImg: function () { self.setState({ imgSn: null }); }
    };
  }
}

window.__dcMount(Component, document.getElementById('tpl'), document.getElementById('app'));
